name: Keep Supabase Alive

on:
  schedule:
    # Executa a cada 3 dias às 12:00 UTC (09:00 BRT)
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          echo "Realizando ping no Supabase para manter o projeto ativo..."
          SUPABASE_URL="https://ogldhoxfbjhgvwpjocoj.supabase.co"
          ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nbGRob3hmYmpoZ3Z3cGpvY29qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NjA2MzUsImV4cCI6MjEwODQzNjYzNX0.y0SC-PYdh0pXgAkmnjWS_GaOWbCdpgkhMTFlWgqbdGs' }}"
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=count")
          
          echo "Código HTTP recebido: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Sucesso! O Supabase registrou a atividade e não será pausado."
          else
            echo "Aviso: Código HTTP $HTTP_STATUS retornado. Verifique as credenciais."
            exit 1
          fi
